<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi Bus Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#1a73e8; --card:#f8f9fb; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--fg); background:var(--bg); }
  #app { display:flex; height:100vh; }
  #side { width:400px; max-width:100%; overflow-y:auto; border-right:1px solid var(--line); padding:14px 16px; }
  #map { flex:1; }
  h1 { font-size:17px; margin:0 0 10px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  .field { position:relative; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .sugg { position:absolute; z-index:1000; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; max-height:240px; overflow:auto; display:none; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .sugg div { padding:7px 10px; cursor:pointer; } .sugg div:hover { background:var(--card); }
  .sugg small { color:var(--muted); }
  .row { display:flex; gap:8px; align-items:end; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .hint { color:var(--muted); font-size:12px; margin:6px 0; }
  .opt { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:10px 0; cursor:pointer; background:#fff; }
  .opt.sel { border-color:var(--accent); box-shadow:0 0 0 2px rgba(26,115,232,.2); }
  .opt .top { display:flex; justify-content:space-between; align-items:baseline; }
  .dur { font-size:18px; font-weight:700; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#e8f0fe; color:#1a56c4; margin-right:4px; }
  .chips { margin:6px 0; }
  .chip { display:inline-block; padding:2px 8px; border-radius:6px; color:#fff; font-weight:600; font-size:12px; margin-right:3px; }
  .walkchip { background:#98a2b3; }
  .legs { margin-top:8px; display:none; border-top:1px dashed var(--line); padding-top:6px; }
  .opt.sel .legs { display:block; }
  .leg { padding:5px 0 5px 10px; border-left:3px solid #98a2b3; margin:4px 0; font-size:13px; }
  .muted { color:var(--muted); font-size:12px; }
  .quiet { font-size:12px; margin-top:4px; padding:4px 8px; border-radius:6px; background:#fef7e0; color:#7a5300; }
  #status { margin-top:8px; font-size:12px; color:var(--muted); }
  @media (max-width: 760px) { #app { flex-direction:column; } #side { width:100%; height:55vh; border-right:0; border-bottom:1px solid var(--line); } #map { height:45vh; } }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>Delhi Bus Journey Planner</h1>
    <div class="hint">Click the map to set origin, then destination. Or search stop names.</div>
    <label>From</label>
    <div class="field"><input id="from" placeholder="Stop name or click map" autocomplete="off"><div class="sugg" id="from-s"></div></div>
    <label>To</label>
    <div class="field"><input id="to" placeholder="Stop name or click map" autocomplete="off"><div class="sugg" id="to-s"></div></div>
    <div class="row">
      <div style="flex:1"><label>Depart (IST)</label><input id="depart" type="datetime-local"></div>
      <button id="go">Plan</button>
    </div>
    <label style="display:flex;gap:6px;align-items:center;color:var(--fg);font-size:13px;margin-top:8px">
      <input type="checkbox" id="live" style="width:auto"> Live traffic (replay 28 Oct) <span class="muted" id="clock"></span></label>
    <div class="row" style="margin-top:6px"><button class="sec" id="swap">Swap</button><button class="sec" id="clear">Clear</button></div>
    <div id="status"></div>
    <div id="results"></div>
  </div>
  <div id="map"></div>
</div>
<script>
const COLORS = ['#1a73e8','#d93025','#188038','#e37400','#9334e6','#00897b'];
const map = L.map('map').setView([28.6139, 77.209], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap'}).addTo(map);
let pts = {from: null, to: null}, markers = {}, layer = L.layerGroup().addTo(map), lastData = null;

function istNow() {
  const d = new Date(Date.now() + (5.5*60 + new Date().getTimezoneOffset())*60000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
document.getElementById('depart').value = istNow();

function setPoint(which, lat, lng, label) {
  pts[which] = {lat, lng};
  document.getElementById(which).value = label || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  if (markers[which]) map.removeLayer(markers[which]);
  markers[which] = L.circleMarker([lat, lng], {radius: 9, color: '#fff', weight: 3, fillOpacity: 1,
    fillColor: which === 'from' ? '#188038' : '#d93025'}).addTo(map).bindTooltip(which === 'from' ? 'Origin' : 'Destination');
  if (pts.from && pts.to) plan();
}
map.on('click', e => setPoint(!pts.from ? 'from' : (!pts.to ? 'to' : 'to'), e.latlng.lat, e.latlng.lng));

for (const which of ['from', 'to']) {
  const inp = document.getElementById(which), box = document.getElementById(which + '-s');
  let timer;
  inp.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inp.value.trim();
    if (q.length < 2) { box.style.display = 'none'; return; }
    timer = setTimeout(async () => {
      const r = await fetch('/stops/search?q=' + encodeURIComponent(q)).then(r => r.json());
      box.innerHTML = '';
      for (const s of r.results) {
        const d = document.createElement('div');
        d.innerHTML = `${s.name} <small>${s.n_routes} routes</small>`;
        d.onclick = () => { box.style.display = 'none'; setPoint(which, s.lat, s.lng, s.name); map.panTo([s.lat, s.lng]); };
        box.appendChild(d);
      }
      box.style.display = r.results.length ? 'block' : 'none';
    }, 200);
  });
  inp.addEventListener('blur', () => setTimeout(() => box.style.display = 'none', 200));
}
document.getElementById('go').onclick = plan;
document.getElementById('live').onchange = async e => {
  document.getElementById('depart').disabled = e.target.checked;
  document.getElementById('clock').textContent = '';
  if (e.target.checked) {
    try {
      const st = await fetch('/realtime/status').then(r => r.json());
      document.getElementById('clock').textContent = st.enabled ? `clock ${st.clock.slice(11,16)}` : '(not loaded)';
    } catch (err) { document.getElementById('clock').textContent = '(not loaded)'; }
  }
  if (pts.from && pts.to) plan();
};
document.getElementById('swap').onclick = () => {
  const f = pts.from, t = pts.to, fv = document.getElementById('from').value, tv = document.getElementById('to').value;
  pts = {from: null, to: null};
  if (t) setPoint('from', t.lat, t.lng, tv);
  if (f) setPoint('to', f.lat, f.lng, fv);
};
document.getElementById('clear').onclick = () => {
  pts = {from: null, to: null}; layer.clearLayers();
  for (const k in markers) map.removeLayer(markers[k]); markers = {};
  document.getElementById('from').value = ''; document.getElementById('to').value = '';
  document.getElementById('results').innerHTML = ''; document.getElementById('status').textContent = '';
};

const fmtMin = s => s >= 3600 ? `${Math.floor(s/3600)} h ${Math.round((s%3600)/60)} min` : `${Math.round(s/60)} min`;
const hhmm = iso => iso.slice(11, 16);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function plan() {
  if (!pts.from || !pts.to) { document.getElementById('status').textContent = 'Set both origin and destination.'; return; }
  const live = document.getElementById('live').checked;
  const dep = live ? '' : document.getElementById('depart').value;  // live mode departs "now" on the replay clock
  const url = `/journey?from_lat=${pts.from.lat}&from_lng=${pts.from.lng}&to_lat=${pts.to.lat}&to_lng=${pts.to.lng}` + (dep ? `&depart=${dep}` : '') + (live ? '&realtime=1' : '');
  document.getElementById('status').textContent = 'Planning...';
  const t = performance.now();
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) { document.getElementById('status').textContent = data.detail || 'Error'; return; }
  lastData = data;
  document.getElementById('status').textContent =
    `${data.options.length} options · ${data.compute_ms} ms server · ${Math.round(performance.now()-t)} ms total · ${data.query.daytype} · times: ${data.model.source}` +
    (data.realtime ? (data.realtime.applied ? ` · LIVE @ ${data.realtime.clock.slice(0,16).replace('T',' ')}` : ` · live unavailable (${data.realtime.note || ''})`) : '');
  render(0);
}

// "How long would this usually take at a quieter hour?" (same routes, re-timed by the server)
function quietLine(o) {
  const q = o.quiet_hour;
  if (!q) return '';
  const d = Math.round(q.traffic_delay_s / 60);
  const eff = d >= 2 ? `traffic adds ~${d} min now` : (d <= -2 ? `${-d} min quicker now than then` : 'about the same as now');
  return `<div class="quiet">At a quieter hour (${hhmm(q.depart)}): ${fmtMin(q.duration_s)} door to door, ${fmtMin(q.ride_s)} on the bus vs ${fmtMin(o.ride_s)} now · ${eff}</div>`;
}

function render(sel) {
  const box = document.getElementById('results');
  box.innerHTML = '';
  lastData.options.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = 'opt' + (i === sel ? ' sel' : '');
    let ci = 0;
    const chips = o.legs.filter(l => l.mode === 'bus').map(l => `<span class="chip" style="background:${COLORS[(ci++) % COLORS.length]}">${esc(l.route)}</span>`).join('') || '<span class="chip walkchip">Walk</span>';
    ci = 0;
    const legs = o.legs.map(l => {
      if (l.mode === 'walk') return `<div class="leg">Walk ${l.distance_m} m (${fmtMin(l.duration_s)}) to ${esc(l.to_name)}</div>`;
      const c = COLORS[(ci++) % COLORS.length];
      return `<div class="leg" style="border-color:${c}"><b title="${esc(l.route_short_name)}">${esc(l.route)}</b> towards ${esc(l.headsign || l.route_desc)}<br>
        ${hhmm(l.depart)} board at <b>${esc(l.from_stop.name)}</b> (wait ~${fmtMin(l.wait_s)})<br>
        ${l.num_stops} stops, ${(l.distance_m/1000).toFixed(1)} km, ${fmtMin(l.ride_s)} (slow: ${fmtMin(l.ride_p85_s)})<br>
        ${hhmm(l.arrive)} alight at <b>${esc(l.to_stop.name)}</b>
        ${l.live_next_buses_s ? `<div style="color:#188038;font-weight:600">Live: next ${esc(l.route)} in ${l.live_next_buses_s.map(e => Math.max(0, Math.round(e/60))).join(', ')} min${l.live_wait_s != null ? ` · you'd wait ~${Math.round(l.live_wait_s/60)} min` : ''}</div>` : ''}
        ${l.alt_routes.length ? `<div class="muted">Also: ${l.alt_routes.map(esc).join(', ')}</div>` : ''}</div>`;
    }).join('');
    div.innerHTML = `<div class="top"><span class="dur">${o.duration_p85_s - o.duration_s >= 300 && (o.transfers > 0 || o.wait_s >= 600) ? `${Math.round(o.duration_s/60)}–${fmtMin(o.duration_p85_s)}` : fmtMin(o.duration_s)}</span>
        <span class="muted">${hhmm(o.depart)} – ${hhmm(o.arrive)}</span></div>
      <div>${o.labels.map(t => `<span class="tag">${t.replace('_',' ')}</span>`).join('')}</div>
      <div class="chips">${chips}</div>
      <div class="muted">walk ${o.walk_m} m · wait ${fmtMin(o.wait_s)} · ${o.transfers} transfer${o.transfers === 1 ? '' : 's'} · up to ${fmtMin(o.duration_p85_s)} in heavy traffic</div>
      ${quietLine(o)}
      <div class="legs">${legs}</div>`;
    div.onclick = () => render(i);
    box.appendChild(div);
  });
  draw(lastData.options[sel]);
}

function draw(o) {
  layer.clearLayers();
  if (!o) return;
  let ci = 0;
  const all = [];
  for (const l of o.legs) {
    all.push(...l.polyline);
    if (l.mode === 'walk') {
      L.polyline(l.polyline, {color: '#667085', weight: 4, dashArray: '4 8'}).addTo(layer);
    } else {
      const c = COLORS[(ci++) % COLORS.length];
      L.polyline(l.polyline, {color: c, weight: 6, opacity: .85}).addTo(layer).bindTooltip(l.route);
      for (const s of [l.from_stop, l.to_stop])
        L.circleMarker([s.lat, s.lng], {radius: 5, color: c, fillColor: '#fff', fillOpacity: 1, weight: 3}).addTo(layer).bindTooltip(s.name);
    }
  }
  if (all.length) map.fitBounds(L.latLngBounds(all), {padding: [30, 30]});
}
</script>
</body>
</html>
